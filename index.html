<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reading">
  <title>Reading</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LIBRARY -->
  <main id="library" class="screen">
    <header class="lib-head">
      <h1>Library</h1>
      <button id="addBtn" class="pill-btn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        Add PDF
      </button>
    </header>

    <div id="grid" class="grid"></div>

    <button id="empty" class="dropzone" type="button" hidden>
      <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true"><path d="M6 10c6-2 12-2 18 2 6-4 12-4 18-2v28c-6-2-12-2-18 2-6-4-12-4-18-2z M24 12v28" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
      <strong>Drop a PDF here</strong>
      <span>or tap to choose a book from Files</span>
    </button>

    <p class="lib-foot">Books are stored on this device, so they open offline.</p>
  </main>

  <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>

  <!-- READER -->
  <section id="reader" class="screen" hidden>
    <div id="rtitle" class="rtitle"></div>
    <div id="stage"></div>

    <button id="prevBtn" class="chev left" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nextBtn" class="chev right" type="button" aria-label="Next page">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="m9 4 8 8-8 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="leftInfo" class="left-info"></div>
    <div class="pbar"><div id="pfill"></div></div>

    <div id="tbar" class="chrome tbar">
      <div class="grp">
        <button id="backBtn" type="button" aria-label="Library" title="Library">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h6v7H4zM14 4h6v7h-6zM4 14h6v6H4zM14 14h6v6h-6z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button id="tocBtn" type="button" aria-label="Contents" title="Contents">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="grp">
        <button id="themeBtn" type="button" aria-label="Toggle dark pages" title="Dark / light pages">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        </button>
      </div>
    </div>

    <div id="bbar" class="chrome bbar">
      <input id="scrub" type="range" min="1" max="1" value="1" aria-label="Go to page">
      <span id="scrubLabel"></span>
    </div>

    <div id="scrim"></div>
    <aside id="toc" class="drawer" aria-label="Contents">
      <header><span id="tocTitle">Contents</span></header>
      <ol id="tocList"></ol>
    </aside>
  </section>

  <div id="dropOverlay" class="drop-overlay"><div>Drop to add to your Library</div></div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
