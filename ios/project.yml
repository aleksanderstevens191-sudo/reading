name: Reading
options:
  bundleIdPrefix: com.aleksanderstevens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3S4B6R8456
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Reading:
    type: application
    platform: iOS
    sources:
      - path: Reading
    entitlements:
      path: Reading/Reading.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    info:
      path: Reading/Info.plist
      properties:
        CFBundleDisplayName: Reading
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aleksanderstevens.reading
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # llama.cpp ships only a device build, so it is linked for real devices only.
        # On the simulator the app builds without it (the Explain panel says so).
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/Vendor/build-apple/llama.xcframework/ios-arm64"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-framework llama"
    postBuildScripts:
      - name: Embed llama.framework (device only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            SRC="$SRCROOT/Vendor/build-apple/llama.xcframework/ios-arm64/llama.framework"
            DST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            mkdir -p "$DST"
            rsync -a --delete "$SRC" "$DST/"
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,flags --timestamp=none "$DST/llama.framework"
            fi
          fi
